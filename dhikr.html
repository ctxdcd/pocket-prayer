<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dhikr — Pocket Prayer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__left">
        <a class="back-link" href="index.html" aria-label="Back to home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3 9 11l5.7 5.7-1.4 1.4L6.2 11l7.1-7.1 1.4 1.4Z"/></svg>
        </a>
        <div>
          <p class="eyebrow">POCKET PRAYER</p>
          <h1>Dhikr</h1>
        </div>
      </div>
      <button class="icon-button" type="button" aria-label="Open settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.5A3.5 3.5 0 1 0 12 15a3.5 3.5 0 0 0 0-6.5Zm9.4 2.2-.9-.2a8.1 8.1 0 0 0-.8-1.9l.5-.8a1.5 1.5 0 0 0-.2-1.9l-.9-.9a1.5 1.5 0 0 0-1.9-.2l-.8.5a8.1 8.1 0 0 0-1.9-.8l-.2-.9A1.5 1.5 0 0 0 13.8 2h-1.6A1.5 1.5 0 0 0 10.8 3l-.2.9c-.7.2-1.4.5-1.9.8l-.8-.5a1.5 1.5 0 0 0-1.9.2l-.9.9a1.5 1.5 0 0 0-.2 1.9l.5.8c-.3.6-.6 1.2-.8 1.9l-.9.2A1.5 1.5 0 0 0 2 14.2v1.6A1.5 1.5 0 0 0 3 17.2l.9.2c.2.7.5 1.4.8 1.9l-.5.8a1.5 1.5 0 0 0 .2 1.9l.9.9a1.5 1.5 0 0 0 1.9.2l.8-.5c.6.3 1.2.6 1.9.8l.2.9A1.5 1.5 0 0 0 10.2 24h1.6a1.5 1.5 0 0 0 1.5-1l.2-.9c.7-.2 1.4-.5 1.9-.8l.8.5a1.5 1.5 0 0 0 1.9-.2l.9-.9a1.5 1.5 0 0 0 .2-1.9l-.5-.8c.3-.6.6-1.2.8-1.9l.9-.2A1.5 1.5 0 0 0 22 15.8v-1.6a1.5 1.5 0 0 0-1-1.5ZM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/>
        </svg>
      </button>
    </header>

    <main class="main">

  <section class="glass-card section-card dhikr-header">
    <p class="info-card__label">Daily Dhikr</p>
    <h2>Small words. Steady heart.</h2>

    <div class="dhikr-nav">
      <button id="prevDhikr" class="nav-circle" aria-label="Previous dhikr">
        <svg viewBox="0 0 24 24"><path d="M15.5 19 8.5 12l7-7-1.4-1.4L5.7 12l8.4 8.4 1.4-1.4Z"/></svg>
      </button>

      <div class="dhikr-title">
        <span id="dhikrArabic">سبحان الله</span>
        <small id="dhikrTrans">SubhanAllah</small>
      </div>

      <button id="nextDhikr" class="nav-circle" aria-label="Next dhikr">
        <svg viewBox="0 0 24 24"><path d="M8.5 5 15.5 12l-7 7 1.4 1.4L18.3 12 9.9 3.6 8.5 5Z"/></svg>
      </button>
    </div>
  </section>

  <section class="dhikr-counter">

    <div class="ring-wrapper">

      <svg class="progress-ring" width="220" height="220">
        <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
        <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="100"></circle>
      </svg>

      <button id="tapCircle" class="tap-circle" aria-label="Tap to count">
        <div class="count" id="count">0</div>
        <div class="hint">tap</div>
      </button>

    </div>

    <button id="resetBtn" class="reset-btn">reset</button>

  </section>

</main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-item" href="index.html">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 3 10v10h6v-6h6v6h6V10l-9-7Z"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a class="nav-item" href="salah.html">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h12v4H6V3Zm1 5h10v13H7V8Zm2 2v2h6v-2H9Zm0 4v2h6v-2H9Z"/></svg>
        </span>
        <span>Salah</span>
      </a>
      <a class="nav-item nav-item--active" href="dhikr.html" aria-current="page">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 3a7 7 0 1 1-7 7 7 7 0 0 1 7-7Zm0 4a3 3 0 1 0 3 3 3 3 0 0 0-3-3Z"/></svg>
        </span>
        <span>Dhikr</span>
      </a>
      <a class="nav-item" href="dua.html">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- paper shape -->
  <path d="M6 3h9l3 3v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- inner lines -->
  <path d="M8 10h8M8 13h8M8 16h6"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"/>

</svg>
        </span>
        <span>Daily du’a</span>
      </a>
    </nav>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
